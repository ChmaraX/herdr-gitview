name: release
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach binaries to (e.g. v0.2.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          asset="herdr-gitview-${{ inputs.tag }}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/herdr-gitview" dist/
          tar -czf "${asset}.tar.gz" -C dist herdr-gitview
          shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            herdr-gitview-*.tar.gz
            herdr-gitview-*.tar.gz.sha256
