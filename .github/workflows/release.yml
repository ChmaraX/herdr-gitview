name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          asset="herdr-gitview-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/herdr-gitview" dist/
          tar -czf "${asset}.tar.gz" -C dist herdr-gitview
          shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256"
      - name: upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            herdr-gitview-*.tar.gz
            herdr-gitview-*.tar.gz.sha256
