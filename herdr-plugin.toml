id = "adamchmara.gitview"
name = "gitview"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Two-pane git view: changed files + diff, Enter opens nvim"
platforms = ["macos", "linux"]

[[panes]]
id = "preview"
title = "gitview: diff"
placement = "tab"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" preview"]

[[panes]]
id = "list"
title = "gitview: files"
placement = "split"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" list"]

[[panes]]
id = "ask"
title = "gitview: confirm"
placement = "overlay"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" ask"]

[[panes]]
id = "annotate"
title = "gitview: note"
placement = "overlay"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" annotate"]

[[panes]]
id = "pick-agent"
title = "gitview: send to agent"
placement = "overlay"
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" pick-agent"]

[[actions]]
id = "toggle"
title = "gitview: toggle"
contexts = ["pane", "workspace"]
command = ["sh", "-c", "exec sh \"$HERDR_PLUGIN_ROOT/herdr/run.sh\" toggle"]

[[build]]
command = ["bash", "herdr/install.sh"]
